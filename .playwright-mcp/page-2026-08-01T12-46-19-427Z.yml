          - generic [ref=f2e191]:
            - text: 晨雾尚未散尽，旅店的木招牌在风里轻轻晃了一下。你推开吱呀作响的门，灰尘在斜射的日光里浮动——这间祖传的旅店，如今只剩你一个人了。所幸灶台还稳，地窖里还剩半袋晨露麦粉。 一位披着
            - emphasis [ref=f2e192]: 褪色法袍
            - text: 的旅人推门而入，斗篷上还沾着露水。他环顾四周，目光在空荡的大堂停留了片刻，轻声道：「听说这里的麦酒还算暖人……若不嫌弃，给我来一份热汤便好。」
            - blockquote [ref=f2e193]: 后院那口老井泛起淡淡的薄荷蓝微光——井底的净水符文被春水唤醒了。
