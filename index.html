/* ============================================================
   IndexedDB 资产仓库 · 员工自定义头像
   Blob 只存 Assets 表，不进入 localStorage / MVU。
   ============================================================ */
const Assets = (function () {
  'use strict';

  const DB_NAME = 'pastoral_assets';
  const DB_VERSION = 1;
  const STORE = 'Assets';
  const urls = new Map();
  let dbPromise = null;

  function available() { return typeof indexedDB !== 'undefined' && indexedDB && typeof indexedDB.open === 'function'; }

  function scope() {
    try {
      if (typeof getCurrentCharacterName === 'function') return getCurrentCharacterName() || 'unknown-character';
    } catch (e) { /* ignore */ }
    return location && location.pathname ? location.pathname : 'standalone';
  }

  function staffKey(name) { return scope() + '::' + String(name || ''); }

  function open() {
    if (!available()) return Promise.resolve(null);
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'key' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('IndexedDB 打开失败'));
    }).catch((e) => { dbPromise = null; console.error('[Pastoral][Assets]', e); return null; });
    return dbPromise;
  }

  async function transact(mode, run) {
    const db = await open();
    if (!db) return null;
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, mode);
      const store = tx.objectStore(STORE);
      let request;
      try { request = run(store); } catch (e) { reject(e); return; }
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('IndexedDB 操作失败'));
    }).catch((e) => { console.error('[Pastoral][Assets]', e); return null; });
  }

  async function putStaffAvatar(name, blob) {
    if (!blob || !String(blob.type || '').startsWith('image/')) return false;
    const key = staffKey(name);
    const result = await transact('readwrite', (store) => store.put({ key, kind: 'staff-avatar', blob, mime: blob.type, updatedAt: Date.now() }));
    revoke(key);
    return result != null;
  }

  async function getStaffAvatar(name) {
    const record = await transact('readonly', (store) => store.get(staffKey(name)));
    return record && record.blob ? record.blob : null;
  }

  async function removeStaffAvatar(name) {
    const key = staffKey(name);
    const result = await transact('readwrite', (store) => store.delete(key));
    revoke(key);
    return result !== null;
  }

  function revoke(key) {
    const old = urls.get(key);
    if (old && typeof URL !== 'undefined' && URL.revokeObjectURL) URL.revokeObjectURL(old);
    urls.delete(key);
  }

  async function avatarUrl(name) {
    const key = staffKey(name);
    if (urls.has(key)) return urls.get(key);
    const blob = await getStaffAvatar(name);
    if (!blob || typeof URL === 'undefined' || !URL.createObjectURL) return '';
    const url = URL.createObjectURL(blob); urls.set(key, url); return url;
  }

  function cleanup() { Array.from(urls.keys()).forEach(revoke); }
  if (typeof addEventListener === 'function') addEventListener('beforeunload', cleanup);

  return { available, staffKey, putStaffAvatar, getStaffAvatar, removeStaffAvatar, avatarUrl, cleanup };
})();
window.Assets = Assets;


/* === mvu.js === */
/* ============================================================
   MVU 读取与轮询
   - waitGlobalInitialized('Mvu') 后用 Mvu.getMvuData 取 stat_data
   - 伪同层：UI 固定在 0 楼，但属性变量永远读【最新一楼】
   - API 不可用（独立预览）回退 SAMPLE_STATE
   ============================================================ */
const MVU = {
  ready: false,
  DIMENSIONS: ['美食', '知识', '舒适', '冒险', '文化', '自然'],

  number(value, fallback = 0) {
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
  },

  calculateFacilityGravity(state) {
    const root = state && typeof state === 'object' ? state : {};
    const built = root.建筑 && root.建筑.已建成 && typeof root.建筑.已建成 === 'object'
      ? root.建筑.已建成 : {};
    const dimensions = Object.fromEntries(this.DIMENSIONS.map((key) => [key, 0]));
    Object.values(built).forEach((building) => {
      const influence = building && building.影响力 && typeof building.影响力 === 'object' ? building.影响力 : {};
      this.DIMENSIONS.forEach((key) => { dimensions[key] += this.number(influence[key], 0); });
    });
    this.DIMENSIONS.forEach((key) => { dimensions[key] = Math.round(dimensions[key] * 1000) / 1000; });
    const ecology = root.访客生态 && typeof root.访客生态 === 'object' ? root.访客生态 : {};
    const facility = this.DIMENSIONS.reduce((sum, key) => sum + dimensions[key], 0);
    const total = this.number(ecology.声望引力, 0) + facility
      + this.number(ecology.服务引力, 0) + this.number(ecology.环境引力, 0);
    return { dimensions, facility, total: Math.round(total * 1000) / 1000 };
  },

  applyFacilityGravity(data) {
    const next = this.clone(data) || { stat_data: {} };
    const state = next.stat_data || (next.stat_data = {});
    const ecology = state.访客生态 && typeof state.访客生态 === 'object'
      ? state.访客生态 : (state.访客生态 = {});
    const calculated = this.calculateFacilityGravity(state);
    ecology.设施引力 = calculated.dimensions;
    ecology.总引力值 = calculated.total;
    return { data: next, calculated };
  },

  settleDay(data, settlementId) {
    const prepared = this.applyFacilityGravity(data);
    const next = prepared.data;
    const state = next.stat_data || (next.stat_data = {});
    const marker = String(settlementId || '');
    const meta = next.pastoral || (next.pastoral = {});
    if (marker && meta.lastSettlementId === marker) {
      return { data: next, calculated: prepared.calculated, skipped: true, report: meta.lastSettlementReport || {} };
    }

    const inn = state.旅店 && typeof state.旅店 === 'object' ? state.旅店 : (state.旅店 = {});
    const employees = inn.员工 && typeof inn.员工 === 'object' ? inn.员工 : {};
    const built = state.建筑 && state.建筑.已建成 && typeof state.建筑.已建成 === 'object' ? state.建筑.已建成 : {};
    const beforeFunds = this.number(inn.资金, 0);
    const salary = Object.values(employees).reduce((sum, employee) => sum + this.number(employee && employee.职业信息 && employee.职业信息.日薪, 0), 0);
    const maintenance = Object.values(built).reduce((sum, building) => sum + this.number(building && building.维护费用, 0), 0);
    inn.资金 = beforeFunds - salary - maintenance;

    const farm = state.农牧 && typeof state.农牧 === 'object' ? state.农牧 : {};
    const advance = (grid, magic) => {
      Object.values(grid && typeof grid === 'object' ? grid : {}).forEach((plot) => {
        if (!plot || typeof plot !== 'object') return;
        if (plot.状态 === '种植中') plot.剩余天数 = Math.max(0, this.number(plot.剩余天数, 0) - 1);
        plot.今日已浇水 = false;
        if (magic) { plot.今日已魔力灌溉 = false; plot.今日已养护 = false; }
      });
    };
    advance(farm.农田网格, false);
    advance(farm.魔法农田网格, true);

    const forecast = state.当日预报 && typeof state.当日预报 === 'object' ? state.当日预报 : (state.当日预报 = {});
    const report = {
      settlementId: marker,
      initialFunds: this.number(forecast.日初资金, beforeFunds),
      beforeFunds,
      salary,
      maintenance,
      afterFunds: inn.资金,
      facilityGravity: prepared.calculated.dimensions,
      totalGravity: prepared.calculated.total
    };
    forecast.日初资金 = inn.资金;
    if (marker) meta.lastSettlementId = marker;
    meta.lastSettlementReport = report;
    return { data: next, calculated: prepared.calculated, skipped: false, report };
  },

  async init() {
    if (typeof waitGlobalInitialized === 'function') {
      try {
        await waitGlobalInitialized('Mvu');
        this.ready = (typeof Mvu !== 'undefined');
      } catch (e) {
        this.ready = false;
      }
    }
  },

  latestMessageId() {
    try {
      return (typeof getLastMessageId === 'function') ? getLastMessageId() : 'latest';
    } catch (e) {
      return 'latest';
    }
  },

  clone(value) {
    if (value == null) return value;
    try { if (typeof structuredClone === 'function') return structuredClone(value); } catch (e) { /* JSON fallback */ }
    return JSON.parse(JSON.stringify(value));
  },

  /** 取 lastMessageId 对应的完整 MvuData 独立快照。 */
  getDataSnapshot() {
    try {
      if (this.ready && typeof Mvu !== 'undefined') {
        const data = Mvu.getMvuData({ type: 'message', message_id: this.latestMessageId() });
        if (data) return this.clone(data);
      }
    } catch (e) { /* fall through */ }
    return { stat_data: this.clone(window.SAMPLE_STATE) };
  },

  async writeData(data, messageId) {
    if (!this.ready || typeof Mvu === 'undefined' || typeof Mvu.replaceMvuData !== 'function') return false;
    await Mvu.replaceMvuData(data, { type: 'message', message_id: messageId == null ? this.latestMessageId() : messageId });
    return true;
  },

  async syncFacilityGravity(messageId) {
    const applied = this.applyFacilityGravity(this.getDataSnapshot());
    await this.writeData(applied.data, messageId);
    return applied;
  },

  async settleAndWrite(messageId, settlementId) {
    const settled = this.settleDay(this.getDataSnapshot(), settlementId);
    if (!settled.skipped) await this.writeData(settled.data, messageId);
    return settled;
  },

  /** 取【最新一楼】stat_data；不可用则回退样例 */
  getState() {
    const data = this.getDataSnapshot();
    return data && data.stat_data ? data.stat_data : window.SAMPLE_STATE;
  },

  isLive() {
    return this.ready && typeof Mvu !== 'undefined' && typeof getLastMessageId === 'function';
  }
};
window.MVU = MVU;


/* === api.js === */
/* ============================================================
   双轨 API / MVU 后处理引擎
   主模型负责剧情；可选第二 API 负责 UpdateVariable 计算。
   ============================================================ */
const ApiEngine = (function () {
  'use strict';

  const RULE_ENTRY_NAME = '目前待定';
  const PREFIX_MAIN = '[Pastoral][MainAPI]';
  const PREFIX_SECOND = '[Pastoral][SecondAPI]';
  const MAX_SOURCE_LENGTH = 60000;
  let sequence = 0;
  let lastFailure = null;

  function now() { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); }
  function log(prefix, stage, detail) { console.info(prefix, stage, detail || ''); }
  function error(prefix, stage, value) { console.error(prefix, stage, value && value.message || value); }

  function textResult(result) {
    if (typeof result === 'string') return result;
    if (result && typeof result.content === 'string') return result.content;
    return '';
  }

  function latestMessages(limit) {
    if (typeof getChatMessages !== 'function' || typeof getLastMessageId !== 'function') return [];
    const end = getLastMessageId();
    const start = Math.max(0, end - Math.max(1, limit || 3) + 1);
    const list = getChatMessages(start + '-' + end);
    return (Array.isArray(list) ? list : [])
      .filter((m) => m && String(m.message || '').length <= MAX_SOURCE_LENGTH)
      .slice(-Math.max(1, limit || 3));
  }

  async function readVariableRules() {
    if (typeof getCharWorldbookNames !== 'function' || typeof getWorldbook !== 'function') {
      throw new Error('当前环境不支持读取角色卡世界书');
    }
    const bound = getCharWorldbookNames('current') || {};
    const names = [bound.primary].concat(bound.additional || []).filter(Boolean);
    if (!names.length) throw new Error('当前角色卡没有绑定世界书');
    const parts = [];
    for (const name of names) {
      const entries = await getWorldbook(name);
      (Array.isArray(entries) ? entries : []).forEach((entry) => {
        if (entry && entry.enabled !== false && entry.name === RULE_ENTRY_NAME && String(entry.content || '').trim()) {
          parts.push('【' + name + '】\n' + String(entry.content).trim());
        }
      });
    }
    if (!parts.length) throw new Error('绑定世界书中未找到“' + RULE_ENTRY_NAME + '”条目');
    return parts.join('\n\n');
  }

  // 等用户补充“最近三层之外”的输入时，只需扩展这里。
  function buildAdditionalContext() { return ''; }

  function configuredPrompt(kind, config) {
    if (Settings && typeof Settings.promptFor === 'function') {
      try { return Settings.promptFor(kind, config); } catch (e) { /* 兼容旧设置桩 */ }
    }
    const prompts = config && config.prompts || {};
    const custom = String(prompts[kind] || '').trim();
    if (custom) return custom;
    return kind === 'endday'
      ? '完成归寝日结；不得重复脚本已经完成的薪资、维护费、植物成长和设施引力结算。'
      : '根据最新剧情执行常规变量更新。';
  }

  function buildDailyPurpose(config) {
    return configuredPrompt('endday', config || Settings.load());
  }

  function buildPrompt(context) {
    const history = latestMessages(3).map((m) => {
      const role = m.role === 'user' ? '玩家' : (m.role === 'assistant' ? '主模型' : '系统');
      return role + ' #' + m.message_id + ':\n' + Extract.stripUpdateVariable(m.message || '');
    }).join('\n\n');
    const config = Settings.load();
    const purpose = context.purpose === 'endday'
      ? buildDailyPurpose(config)
      : configuredPrompt('normal', config);
    const extra = buildAdditionalContext(context);
    const calculated = context.calculated
      ? '【脚本已确定事实（不得重算或重复应用）】\n' + JSON.stringify(context.calculated)
      : '';
    return [
      '你是暮归旅店的变量计算引擎，不续写剧情。',
      '【任务】\n' + purpose,
      '【最近三层正文】\n' + (history || '（无）'),
      '【变量规则】\n' + context.rules,
      '【主生成前当前变量数据】\n' + JSON.stringify(context.baseline && context.baseline.stat_data || {}),
      calculated,
      extra ? '【附加信息】\n' + extra : '',
      '【输出格式】\n必须输出且只输出一个完整的 <UpdateVariable>...</UpdateVariable> 标签；归寝日结允许在标签前输出简洁总结。不得使用 Markdown 代码围栏。'
    ].filter(Boolean).join('\n\n');
  }

  function timeoutCall(factory, timeout, generationId) {
    let timer;
    const timeoutPromise = new Promise((_, reject) => {
      timer = setTimeout(() => {
        try { if (typeof stopGenerationById === 'function') stopGenerationById(generationId); } catch (e) { /* ignore */ }
        reject(new Error('第二 API 请求超时（' + timeout + 'ms）'));
      }, timeout);
    });
    return Promise.race([Promise.resolve().then(factory), timeoutPromise]).finally(() => clearTimeout(timer));
  }

  async function callSecondApiForVariable(context) {
    const cfg = Settings.load();
    if (cfg.apiMode !== 'multi') throw new Error('当前未启用多 API 模式');
    if (!Settings.isSecondApiComplete(cfg)) throw new Error('第二 API 配置不完整');
    const rules = await readVariableRules();
    const prompt = buildPrompt(Object.assign({}, context, { rules }));
    const api = cfg.secondApi;
    let failure;
    for (let attempt = 0; attempt <= api.maxRetries; attempt++) {
      const id = 'pastoral-second-' + (++sequence);
      const started = now();
      log(PREFIX_SECOND, '开始', { attempt: attempt + 1, messageId: context.messageId });
      try {
        const raw = textResult(await timeoutCall(() => generateRaw({
          generation_id: id,
          user_input: prompt,
          should_stream: false,
          should_silence: true,
          max_chat_history: 0,
          ordered_prompts: ['user_input'],
          custom_api: { apiurl: api.url, key: api.key, model: api.model, source: 'openai' }
        }), api.timeout, id));
        const updateTag = Extract.normalizeUpdateVariable(raw);
        if (!updateTag) throw new Error('第二 API 未返回 UpdateVariable 或有效 MVU 更新命令');
        log(PREFIX_SECOND, '完成', { attempt: attempt + 1, elapsedMs: Math.round(now() - started) });
        return { raw, updateTag, summary: Extract.stripUpdateVariable(raw).trim(), source: 'second' };
      } catch (e) {
        failure = e;
        error(PREFIX_SECOND, '失败（尝试 ' + (attempt + 1) + '）', e);
      }
    }
    throw failure || new Error('第二 API 调用失败');
  }

  function messageById(messageId) {
    if (typeof getChatMessages !== 'function') return null;
    const found = getChatMessages(messageId);
    return Array.isArray(found) && found[0] ? found[0] : null;
  }

  async function applyUpdate(messageId, original, baseline, generated) {
    const merged = Extract.replaceUpdateVariable(original, generated.updateTag);
    if (typeof setChatMessages !== 'function') throw new Error('当前环境无法写回聊天楼层');
    await setChatMessages([{ message_id: messageId, message: merged }], { refresh: 'none' });
    if (typeof Mvu === 'undefined' || typeof Mvu.parseMessage !== 'function' || typeof Mvu.replaceMvuData !== 'function') {
      throw new Error('MVU 接口未就绪');
    }
    const parsed = await Mvu.parseMessage(generated.updateTag, baseline);
    if (!parsed) throw new Error('MVU 未解析出有效变量更新');
    await Mvu.replaceMvuData(parsed, { type: 'message', message_id: messageId });
    return merged;
  }

  async function processAfterMain(context) {
    const messageId = Number(context.messageId == null ? MVU.latestMessageId() : context.messageId);
    const message = messageById(messageId);
    if (!message) return { ok: false, skipped: true, reason: '找不到主模型最新楼层' };
    try {
      const generated = await callSecondApiForVariable(Object.assign({}, context, { messageId }));
      await applyUpdate(messageId, message.message || '', context.baseline, generated);
      if (window.MVU && typeof MVU.syncFacilityGravity === 'function') await MVU.syncFacilityGravity(messageId);
      lastFailure = null;
      return { ok: true, source: generated.source, summary: generated.summary, messageId };
    } catch (e) {
      lastFailure = Object.assign({}, context, { messageId });
      error(PREFIX_SECOND, '降级保留主模型变量', e);
      if (typeof toast === 'function') toast('error', '第二 API 失败', (e && e.message || String(e)) + '；已保留主模型结果，可手动重试。');
      return { ok: false, source: 'main', error: e, messageId };
    }
  }

  async function callMainApiForDaily(context) {
    if (typeof generateRaw !== 'function') throw new Error('当前环境不支持主 API 静默日结');
    const rules = await readVariableRules();
    const prompt = buildPrompt(Object.assign({}, context, { purpose: 'endday', rules }));
    const id = 'pastoral-daily-main-' + (++sequence);
    const started = now();
    log(PREFIX_MAIN, '日结开始', { messageId: context.messageId });
    const raw = textResult(await timeoutCall(() => generateRaw({
      generation_id: id,
      user_input: prompt,
      should_stream: false,
      should_silence: true,
      max_chat_history: 0,
      ordered_prompts: ['user_input']
    }), 30000, id));
    const updateTag = Extract.extractUpdateVariable(raw);
    if (!updateTag) throw new Error('主 API 日结未返回 UpdateVariable');
    log(PREFIX_MAIN, '日结完成', { elapsedMs: Math.round(now() - started) });
    return { raw, updateTag, summary: Extract.stripUpdateVariable(raw).trim(), source: 'main' };
  }

  async function appendDailyUpdate(messageId, original, baseline, generated) {
    const addition = [generated.summary, generated.updateTag].filter(Boolean).join('\n\n');
    const merged = String(original || '').trim() + (original ? '\n\n' : '') + addition;
    if (typeof setChatMessages === 'function') {
      await setChatMessages([{ message_id: messageId, message: merged }], { refresh: 'none' });
    }
    if (typeof Mvu === 'undefined' || typeof Mvu.parseMessage !== 'function' || typeof Mvu.replaceMvuData !== 'function') {
      throw new Error('MVU 接口未就绪');
    }
    const parsed = await Mvu.parseMessage(generated.updateTag, baseline);
    if (!parsed) throw new Error('MVU 未解析出有效日结更新');
    await Mvu.replaceMvuData(parsed, { type: 'message', message_id: messageId });
  }

  async function processEndday(context) {
    const messageId = Number(context.messageId == null ? MVU.latestMessageId() : context.messageId);
    const message = messageById(messageId);
    if (!message) return { ok: false, skipped: true, reason: '找不到归寝剧情楼层' };
    const cfg = Settings.load();
    if (cfg.apiMode === 'multi') {
      try {
        const generated = await ApiEngine.callSecondApiForVariable(Object.assign({}, context, { messageId, purpose: 'endday' }));
        await applyUpdate(messageId, message.message || '', context.baseline, generated);
        if (window.MVU && typeof MVU.syncFacilityGravity === 'function') await MVU.syncFacilityGravity(messageId);
        return { ok: true, source: 'second', summary: generated.summary, messageId };
      } catch (secondError) {
        error(PREFIX_SECOND, '归寝日结降级到主 API', secondError);
        if (typeof toast === 'function') toast('warn', '副 API 日结失败', '正在改用当前主 API 完成日结。');
      }
    }
    try {
      // 主剧情的 MVU 已由酒馆处理，单 API 日结从此刻最新快照继续计算。
      const baseline = MVU.getDataSnapshot ? MVU.getDataSnapshot() : context.baseline;
      const generated = await callMainApiForDaily({ baseline, messageId, purpose: 'endday', calculated: context.calculated });
      await appendDailyUpdate(messageId, message.message || '', baseline, generated);
      if (window.MVU && typeof MVU.syncFacilityGravity === 'function') await MVU.syncFacilityGravity(messageId);
      return { ok: true, source: 'main', summary: generated.summary, messageId };
    } catch (e) {
      error(PREFIX_MAIN, '日结失败', e);
      if (typeof toast === 'function') toast('error', '每日结算失败', e && e.message || String(e));
      return { ok: false, source: 'main', error: e, messageId };
    }
  }

  async function retryLastFailure() {
    if (!lastFailure) throw new Error('没有可重试的第二 API 请求');
    return processAfterMain(lastFailure);
  }

  return {
    RULE_ENTRY_NAME,
    buildAdditionalContext,
    buildDailyPurpose,
    buildPrompt,
    callSecondApiForVariable,
    processAfterMain,
    processEndday,
    retryLastFailure,
    get lastFailure() { return lastFailure; }
  };
})();
window.ApiEngine = ApiEngine;


/* === chat.js === */
/* ============================================================
   全局消息接管（Chat）
   - 0 楼宿主用 getChatMessages('0-' + lastMessageId) 抓取全局对话
   - Hash 机制（消息数_最后一楼字符数_生成状态）避免无效 DOM 重绘
   - 气泡右键菜单：编辑 / 复制 / 删除，直接操作对应 message_id
   - composer：/send + /trigger 接管原生输入框
   ============================================================ */
const Chat = (function () {
  'use strict';

  const POLL_MS = 400;
  const MAX_RAW = 60000; // 单楼原文超长（如 0 楼卡片源码）跳过渲染

  let lastHash = null;
  let timer = null;
  let generating = false;
  let busy = false;
  let composedKind = 'normal';
  let requestSeq = 0;
  let generationCycle = 0;
  const generationWaiters = [];
  let messages = [];

  /* ---------- 酒馆 API 探测 ---------- */
  function hasApi() {
    return typeof getChatMessages === 'function' && typeof getLastMessageId === 'function';
  }

  function lastId() {
    try {
      if (typeof getLastMessageId === 'function') return getLastMessageId();
    } catch (e) { /* ignore */ }
    return 0;
  }

  /* ---------- 生成状态 ---------- */
  function bindGenerationEvents() {
    if (typeof eventOn !== 'function' || typeof iframe_events === 'undefined') return;
    try {
      eventOn(iframe_events.GENERATION_STARTED, () => { generating = true; });
      const finish = () => {
        generating = false;
        generationCycle++;
        generationWaiters.splice(0).forEach((resolve) => resolve(generationCycle));
      };
      eventOn(iframe_events.GENERATION_ENDED, finish);
      if (typeof tavern_events !== 'undefined') {
        eventOn(tavern_events.GENERATION_STOPPED, finish);
      }
    } catch (e) { /* ignore */ }
  }

  /* ---------- 抓取全局对话 ---------- */
  function fetchAll() {
    if (!hasApi()) return [];
    try {
      const arr = getChatMessages('0-' + lastId());
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  /** Hash：消息数_最后一楼字符数_生成状态 */
  function hashOf(list) {
    const n = list.length;
    const tail = n ? (list[n - 1].message || '').length : 0;
    return n + '_' + tail + '_' + (generating ? 1 : 0);
  }

  /* ---------- 渲染 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** 单条消息 -> 气泡 DOM */
  function bubble(msg) {
    const role = msg.role === 'user' ? 'user' : (msg.role === 'system' ? 'system' : 'ai');
    const el = document.createElement('article');
    el.className = 'bub bub--' + role;
    el.dataset.mid = String(msg.message_id);
    if (msg.is_hidden) el.classList.add('is-hidden-msg');

    const body = document.createElement('div');
    body.className = 'bub__body';
    const raw = msg.message || '';

    if (role === 'ai') {
      if (raw.length > MAX_RAW) {
        body.innerHTML = '<p class="muted">（本楼内容为界面源码，已折叠）</p>';
      } else {
        const html = Extract.extractCleanContent(raw);
        body.innerHTML = (html && html.trim())
          ? html
          : '<p class="muted">（本楼无可显示正文）</p>';
      }
    } else {
      body.innerHTML = '<p>' + esc(raw).replace(/\n/g, '<br>') + '</p>';
    }

    const meta = document.createElement('div');
    meta.className = 'bub__meta';
    meta.innerHTML = '<span class="bub__who">' + esc(msg.name || (role === 'user' ? '我' : '旅店')) +
      '</span><span class="bub__id">#' + msg.message_id + '</span>';

    el.appendChild(meta);
    el.appendChild(body);

  function nearBottom(box) {
    return box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  }

  function renderStream(list) {
    const box = document.getElementById('stream');
    if (!box) return;
    const stick = nearBottom(box);
    box.innerHTML = '';
    list.forEach((m) => box.appendChild(bubble(m)));
    if (generating) {
      const t = document.createElement('div');
      t.className = 'bub bub--ai bub--typing';
      t.innerHTML = '<div class="bub__body"><span class="typing"><i></i><i></i><i></i></span></div>';
      box.appendChild(t);
    }
    if (stick) box.scrollTop = box.scrollHeight;

  /* ---------- 右键菜单：编辑 / 复制 / 删除 ---------- */
  function closeMenu() {
    const m = document.getElementById('bubMenu');
    if (m) m.remove();
  }

  function openMenu(x, y, mid) {
    closeMenu();
    const isHostFloor = mid === 0;
    const menu = document.createElement('div');
    menu.className = 'bub-menu';
    menu.id = 'bubMenu';
    menu.setAttribute('role', 'menu');

    const item = (icon, label, fn, danger) => {
      const b = document.createElement('button');
      b.className = 'bub-menu__item' + (danger ? ' is-danger' : '');
      b.setAttribute('role', 'menuitem');
      b.innerHTML = '<span class="ic" data-i="' + icon + '"></span><span>' + label + '</span>';
      b.addEventListener('click', (e) => { e.stopPropagation(); fn(b); });
      return b;
    };

    menu.appendChild(item('copy', '复制原文', () => { copyMsg(mid); closeMenu(); }));

    if (!isHostFloor) {
      menu.appendChild(item('pencil', '编辑本楼', () => { closeMenu(); editMsg(mid); }));
      // 删除：两步确认（不可逆操作）
      const del = item('trash', '删除本楼', (btn) => {
        if (btn.dataset.armed === '1') { closeMenu(); deleteMsg(mid); return; }
        btn.dataset.armed = '1';
        btn.innerHTML = '<span class="ic" data-i="trash"></span><span>确认删除 #' + mid + '？</span>';
        Icon.render(btn);
      }, true);
      menu.appendChild(del);
    } else {
      const note = document.createElement('div');
      note.className = 'bub-menu__note';
      note.textContent = '0 楼为界面宿主，不可编辑/删除';
      menu.appendChild(note);
    }

    document.body.appendChild(menu);
    Icon.render(menu);

    // 视口内定位
    const r = menu.getBoundingClientRect();
    const px = Math.min(x, window.innerWidth - r.width - 8);
    const py = Math.min(y, window.innerHeight - r.height - 8);
    menu.style.left = Math.max(8, px) + 'px';
    menu.style.top = Math.max(8, py) + 'px';

    setTimeout(() => {
      const off = (e) => {
        if (!menu.contains(e.target)) { closeMenu(); document.removeEventListener('mousedown', off); }
      };
      document.addEventListener('mousedown', off);
    }, 0);
  }

  function msgById(mid) {
    return messages.find((m) => m.message_id === mid);

    const m = msgById(mid);
    if (!m) return;
    const text = m.message || '';
    const done = () => toast('success', '已复制', '第 ' + mid + ' 楼原文已进剪贴板。');
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {

      } else fallbackCopy(text, done);
    } catch (e) { fallbackCopy(text, done); }
  }

  function fallbackCopy(text, done) {

    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);

    try { document.execCommand('copy'); done(); } catch (e) { toast('warn', '复制失败', '请手动选择文本。'); }
    ta.remove();
  }

  /** 原地编辑：气泡换成 textarea，保存写回对应 message_id */

    if (!el) return;

    const body = el.querySelector('.bub__body');
    if (!body) return;

    const ta = document.createElement('textarea');

    save.className = 'btn btn--sm';
    save.textContent = '保存';
    const cancel = document.createElement('button');
    cancel.className = 'btn btn--ghost btn--sm';
    cancel.textContent = '取消';
    bar.appendChild(save);
    bar.appendChild(cancel);

    body.innerHTML = '';
    body.appendChild(ta);
    body.appendChild(bar);
    ta.focus();

    const restore = () => { el.classList.remove('is-editing'); lastHash = null; poll(); };
    cancel.addEventListener('click', restore);
    save.addEventListener('click', async () => {
      const val = ta.value;
      save.disabled = true;
      try {
        if (typeof setChatMessages === 'function') {
          await setChatMessages([{ message_id: mid, message: val }], { refresh: 'none' });
          toast('success', '已保存', '第 ' + mid + ' 楼已更新。');
        } else {
          toast('warn', '未连接酒馆', '独立预览无法写回。');
        }
      } catch (e) {
        toast('error', '保存失败', String(e && e.message || e));
      }
      restore();
    });
  }

  async function deleteMsg(mid) {
    try {
      if (typeof deleteChatMessages === 'function') {
        await deleteChatMessages([mid]);
        toast('success', '已删除', '第 ' + mid + ' 楼已移除。');
      } else {
        toast('warn', '未连接酒馆', '独立预览无法删除。');
      }
    } catch (e) {
      toast('error', '删除失败', String(e && e.message || e));
    }
    lastHash = null;
    poll();
  }

  /* ---------- composer：接管原生输入 ---------- */

  /** 转义 slash 命令里的管道与花括号 */
  function escSlash(s) {
    return String(s).replace(/\|/g, '\\|').replace(/\{\{/g, '\\{\\{');
  }

  /** 执行 slash 命令（酒馆原生 triggerSlash 优先） */
  function exec(cmd) {
    try {
      if (typeof triggerSlash === 'function') return triggerSlash(cmd);
      if (typeof executeSlashCommandsWithOptions === 'function') return executeSlashCommandsWithOptions(cmd);
      if (typeof executeSlashCommands === 'function') return executeSlashCommands(cmd);
    } catch (e) { /* ignore */ }
    return null;
  }

  /** 把文本填入卡内 composer（不发送），可附带归寝等请求类型。 */
  function compose(text, kind) {
    const ta = document.getElementById('composerInput');
    if (!ta) return false;
    const current = String(ta.value || '').trimEnd();
    const addition = String(text || '').trim();
    ta.value = current && addition ? current + '\n' + addition : (addition || current);
    composedKind = kind || composedKind || 'normal';
    ta.focus();

  }

  function setBusy(on) {
    busy = !!on;

  }

  function waitForGenerationEnd(startCycle, timeout) {
    if (generationCycle > startCycle) return Promise.resolve(true);
    return new Promise((resolve) => {
      const done = () => { clearTimeout(timer); resolve(true); };
      const timer = setTimeout(() => {
        const index = generationWaiters.indexOf(done);
        if (index >= 0) generationWaiters.splice(index, 1);
        resolve(false);
      }, timeout || 120000);
      generationWaiters.push(done);
    });
  }

  async function waitForMainReply(beforeId, token, startCycle) {
    const ended = await waitForGenerationEnd(startCycle, 120000);
    const started = Date.now();
    while (token === requestSeq && Date.now() - started < 5000) {
      const id = lastId();
      if (id > beforeId) {
        const latest = (typeof getChatMessages === 'function' ? getChatMessages(id) : [])[0];
        if (!latest || latest.role !== 'user') return id;
      }
      await new Promise((resolve) => setTimeout(resolve, 120));
    }
    if (!ended) console.warn('[Pastoral][MainAPI]', '未收到生成结束事件，按当前最新楼层降级处理');
    return lastId();
  }

  /** 唯一发送入口：主剧情完成后按模式执行变量后处理。 */
  async function handleUnifiedRequest(text, options) {
    const body = String(text || '').trim();
    if (!body || busy) return false;
    if (!hasApi()) {
      toast('warn', '未连接酒馆', body);
      return false;
    }
    const purpose = options && options.kind || composedKind || 'normal';
    composedKind = 'normal';
    const token = ++requestSeq;
    const beforeId = lastId();
    const startCycle = generationCycle;
    const baseline = window.MVU && MVU.getDataSnapshot ? MVU.getDataSnapshot() : null;
    const mode = window.Settings ? Settings.load().apiMode : 'single';
    setBusy(true);
    generating = true;
    lastHash = null;
    console.info('[Pastoral][MainAPI]', '开始', { beforeId, purpose });
    try {
      await exec('/send ' + escSlash(body));
      poll();
      await exec('/trigger');
      const messageId = await waitForMainReply(beforeId, token, startCycle);
      console.info('[Pastoral][MainAPI]', '完成', { messageId, purpose });
      let calculated = null;
      if (window.MVU) {
        if (purpose === 'endday' && typeof MVU.settleAndWrite === 'function') {
          const settled = await MVU.settleAndWrite(messageId, 'endday-message-' + messageId);
          calculated = Object.assign({}, settled.report, { facilityGravity: settled.calculated && settled.calculated.dimensions });
          window.dispatchEvent(new CustomEvent('pastoral:request-stage', { detail: { stage: 'settled', calculated } }));
        } else if (typeof MVU.syncFacilityGravity === 'function') {
          const synced = await MVU.syncFacilityGravity(messageId);
          calculated = { facilityGravity: synced.calculated.dimensions, totalGravity: synced.calculated.total };
        }
      }
      if (window.ApiEngine) {
        let outcome = null;
        if (purpose === 'endday') outcome = await ApiEngine.processEndday({ baseline: window.MVU ? MVU.getDataSnapshot() : baseline, messageId, purpose, calculated });
        else if (mode === 'multi') outcome = await ApiEngine.processAfterMain({ baseline, messageId, purpose, calculated });
        if (purpose === 'endday' && outcome && outcome.ok) {
          window.dispatchEvent(new CustomEvent('pastoral:daily-summary', { detail: Object.assign({ summary: outcome.summary, source: outcome.source }, calculated || {}) }));
        }
      }
      const composer = document.getElementById('composerInput');
      if (composer && String(composer.value || '').trim() === body) { composer.value = ''; autoGrow(composer); }
      return true;
    } catch (e) {
      console.error('[Pastoral][MainAPI]', '发送失败', e);
      toast('error', '发送失败', String(e && e.message || e));
      return false;
    } finally {
      generating = false;
      lastHash = null;
      setBusy(false);
      poll();
    }
  }

  const send = handleUnifiedRequest;

  function autoGrow(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.min(160, ta.scrollHeight) + 'px';
  }

  /* ---------- 轮询 ---------- */
  function poll() {
    if (!hasApi()) {
      // 独立预览：用样例原文渲染单条气泡
      if (lastHash === 'sample') return;
      lastHash = 'sample';
      messages = [{ message_id: 0, role: 'assistant', name: '暮归旅店', message: window.SAMPLE_RAWTEXT || '' }];
      renderStream(messages);
      window.dispatchEvent(new CustomEvent('pastoral:chat', { detail: { messages } }));
      return;
    }
    const list = fetchAll();
    const h = hashOf(list);
    if (h === lastHash) return;
    lastHash = h;
    messages = list;
    renderStream(list);
    window.dispatchEvent(new CustomEvent('pastoral:chat', { detail: { messages: list } }));
  }

  /** 最新一楼原文（供选项提取） */
  function latestRaw() {
    if (!messages.length) return window.SAMPLE_RAWTEXT || '';
    return messages[messages.length - 1].message || '';
  }

  function init() {
    bindGenerationEvents();

    const box = document.getElementById('stream');
    if (box) {
      box.addEventListener('contextmenu', (e) => {
        const b = e.target.closest ? e.target.closest('.bub') : null;
        if (!b || b.classList.contains('is-editing')) return;
        e.preventDefault();
        openMenu(e.clientX, e.clientY, Number(b.dataset.mid));
      });
    }

    const ta = document.getElementById('composerInput');
    const btn = document.getElementById('composerSend');
    if (ta) {
      ta.addEventListener('input', () => autoGrow(ta));
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const v = ta.value;
          handleUnifiedRequest(v);
        }
      });
    }
    if (btn && ta) {
      btn.addEventListener('click', () => {
        const v = ta.value;
        send(v);
      });
    }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

    poll();
    if (!timer) timer = setInterval(poll, POLL_MS);
  }

  return { init, poll, send, handleUnifiedRequest, compose, latestRaw, get messages() { return messages; }, get generating() { return generating; }, get busy() { return busy; } };
})();
window.Chat = Chat;

    setTimeout(() => { t.classList.add('is-out'); setTimeout(() => t.remove(), 280); }, 3600);
  }
  function burst(x, y) {
    if (reduceMotion) return;
    const layer = document.getElementById('burstLayer'); if (!layer) return;
    for (let i = 0; i < 7; i++) {
      const s = h('span', { class: 'star-burst', html: Icon.get('sparkle') });
      const ang = (Math.PI * 2 * i) / 7, dist = 26 + Math.random() * 42;
      s.style.left = x + 'px'; s.style.top = y + 'px';
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      layer.appendChild(s); setTimeout(() => s.remove(), 900);
    }
  }
  /** 执行 slash 命令；优先用酒馆原生 triggerSlash（勿覆盖同名全局） */
  function runSlash(cmd) {
    try {
      if (typeof triggerSlash === 'function') return triggerSlash(cmd);
      if (typeof executeSlashCommandsWithOptions === 'function') return executeSlashCommandsWithOptions(cmd);
      if (typeof executeSlashCommands === 'function') return executeSlashCommands(cmd);
    } catch (e) { /* ignore */ }
    return null;
  }

  /* ---------- 六维雷达 ---------- */
  function polar(cx, cy, r, deg) {
    const a = (deg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }
  function drawRadar(svg, axes, vals, max, opts = {}) {
    const size = opts.size || 220, cx = size / 2, cy = size / 2;
    const R = size / 2 - (opts.pad || 38), n = axes.length;
    const ang = (i) => (360 / n) * i;
    svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
    svg.innerHTML = '';
    for (let g = 1; g <= 4; g++) {
      const rr = (R * g) / 4, pts = [];
      for (let i = 0; i < n; i++) { const [x, y] = polar(cx, cy, rr, ang(i)); pts.push(`${x.toFixed(1)},${y.toFixed(1)}`); }
      svg.appendChild(sh('polygon', { class: 'radar__grid', points: pts.join(' '), style: g === 4 ? 'stroke:var(--color-border-strong)' : '' }));
    }
    axes.forEach((ax, i) => {
      const [x, y] = polar(cx, cy, R, ang(i));
      svg.appendChild(sh('line', { class: 'radar__axis', x1: cx, y1: cy, x2: x.toFixed(1), y2: y.toFixed(1) }));
      if (opts.showLabels !== false) {
        const [lx, ly] = polar(cx, cy, R + (opts.labelPad || 16), ang(i));
        svg.appendChild(sh('text', { class: 'radar__label', x: lx.toFixed(1), y: ly.toFixed(1), fill: ax.color || 'var(--color-text-soft)' }, ax.name || ax));
      }
    });
    const area = sh('polygon', { class: 'radar__area', points: '' });
    svg.appendChild(area);
    const verts = [];
    vals.forEach((v, i) => {
      const vt = sh('circle', { class: 'radar__vertex', cx, cy, r: opts.vertexR || 3.4 });
      if (axes[i].color) vt.style.fill = axes[i].color;
      svg.appendChild(vt); verts.push(vt);
      if (opts.showVals !== false) {
        const [tx, ty] = polar(cx, cy, R + (opts.labelPad || 16) - 4, ang(i));
        svg.appendChild(sh('text', { class: 'radar__val', x: tx.toFixed(1), y: (ty + 7).toFixed(1) }, String(v)));
      }
      if (opts.onVertex) {
        vt.addEventListener('mouseenter', () => opts.onVertex(axes[i], i));
        vt.addEventListener('click', () => opts.onVertex(axes[i], i));
      }
    });
    const start = performance.now(), dur = reduceMotion ? 1 : (opts.dur || 850);
    function frame(now) {
      const t = Math.min(1, (now - start) / dur), ease = 1 - Math.pow(1 - t, 3);
      const pts = vals.map((v, i) => { const r = R * clamp(v / max, 0, 1) * ease; const [x, y] = polar(cx, cy, r, ang(i)); return `${x.toFixed(1)},${y.toFixed(1)}`; });
      area.setAttribute('points', pts.join(' '));
      verts.forEach((vt, i) => { const r = R * clamp(vals[i] / max, 0, 1) * ease; const [x, y] = polar(cx, cy, r, ang(i)); vt.setAttribute('cx', x.toFixed(1)); vt.setAttribute('cy', y.toFixed(1)); });
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ---- 地图 ---- */
  function renderMap(container, s) {
    const tiles = get(s, '世界.地块', {});
    const explored = new Set(entries(tiles).map(([k]) => k));
    const N = 15, C = 7;
    const neighbors = (x, y) => [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => explored.has(`${x + dx},${y + dy}`));

    let cells = '';
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const x = c - C, y = r - C, key = `${x},${y}`;
        if (explored.has(key)) {
          const t = tiles[key];
          const center = x === 0 && y === 0;
          cells += `<div class="map-cell explored ${center ? 'center' : ''}" data-x="${x}" data-y="${y}" title="${get(t, '类型', '地块')} (${x},${y})"><span class="ic" data-i="${tileIcon(get(t, '类型', ''))}"></span></div>`;
        } else {
          const adj = neighbors(x, y);
          cells += `<div class="map-cell fog ${adj ? 'adjacent' : ''}" data-x="${x}" data-y="${y}">${adj ? '<span class="faint" style="font-size:8px">?</span>' : ''}</div>`;
        }
      }
    }

    container.innerHTML =
      panelH('疆域图志', '探索约耗 15 精力') +
      `<div class="notice notice--info"><span class="ic notice__icon" data-i="info"></span><div>点击已探明地块查看详情；点击迷雾边缘探索新地。</div></div>` +
      `<div class="map-grid" style="grid-template-columns:repeat(${N},1fr)">${cells}</div>` +
      `<div id="tileDetail"></div>`;
    Icon.render(container);

    $$('.map-cell.explored', container).forEach((cell) => {
      cell.addEventListener('click', () => showTile(container, tiles, +cell.dataset.x, +cell.dataset.y));
    });
    $$('.map-cell.fog.adjacent', container).forEach((cell) => {
      cell.addEventListener('click', () => {
        intend(`探索：(${cell.dataset.x},${cell.dataset.y})`);
        burst(window.innerWidth / 2, window.innerHeight * 0.7);
      });
    });
  }
  function showTile(container, tiles, x, y) {
    const t = tiles[`${x},${y}`] || {};
    const res = normalizeRes(get(t, '资源', []));
    const cnt = collectCount(get(t, '本季采集次数', 0));
    const box = $('#tileDetail', container);
    if (!box) return;
    const resHtml = res.length ? res.map((r) => `<div class="dim-source"><span>${r.name}</span><span>×${r.qty}</span></div>`).join('')
      : '<div class="faint" style="font-size:var(--font-size-xs)">此地暂无可采资源。</div>';
    box.innerHTML =
      `<div class="card tile-detail">

      const attr = get(m, '属性', {}), st = get(m, '状态', {}), job = get(m, '职业信息', {}), gem = get(m, '心之宝石', {});

      const vals = axes.map((k) => num(attr[k], 0));

          <svg class="mini-radar" id="radarStaff${i}" viewBox="0 0 50 50"></svg>

        <div class="staff-card__stats">

      const vals = axes.map(() => 0);
      const realVals = ['技艺', '悟性', '体力', '亲和', '专注'].map((k) => num(attr[k], 0));
      drawRadar(svg, axes, realVals, Math.max(15, ...realVals, 1), { size: 50, pad: 4, labelPad: 0, showLabels: false, showVals: false, vertexR: 1.6, dur: 600 });

      const file = input.files && input.files[0]; if (!file) return;

  /* ---- 访客 ---- */
  function renderVisitor(container, s) {

      const sat = clamp(num(get(v, '满意度', 0), 0), 0, 100);
      const r = 16, c = 2 * Math.PI * r, off = c * (1 - sat / 100);
      const col = sat >= 70 ? 'var(--color-success)' : sat >= 40 ? 'var(--color-warning)' : 'var(--color-danger)';
      const special = /特殊|贵族|稀有/.test(get(v, '类型', ''));

      const resist = (get(v, '抗性标签', []) || []).map((t) => `<span class="pill resist-tag" style="border-style:dashed;color:var(--color-danger)">${t}</span>`).join('');
      const seed = pillsFrom(get(v, '携带种子', []), 'pill--amber');

        <div class="visitor-card__head">
          <span class="ic" data-i="${visitorIcon(get(v, '类型', ''))}" style="--ic:20px;color:var(--color-primary)"></span>
          <span class="visitor-card__name">${name}</span>
          <span class="pill">${get(v, '类型', '访客')}</span>
          <div class="satisfaction"><svg width="40" height="40"><circle class="satisfaction__track" cx="20" cy="20" r="${r}"></circle><circle class="satisfaction__fill" cx="20" cy="20" r="${r}" stroke="${col}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"></circle></svg><span class="satisfaction__val" style="color:${col}">${sat}</span></div>
        </div>
        <div class="row" style="gap:4px;flex-wrap:wrap;margin:4px 0"><span class="card__sub">消费 · ${get(v, '消费能力', '中')}</span><span class="card__sub">状态 · ${get(v, '状态', '在店')}</span></div>
        <div class="visitor-card__tags">${pref}${resist}${seed}</div>
      </div>`;
    }).join('');
    Icon.render(container);
  }

        <div class="quest-card__desc">${(q && q.描述) || ''}</div>

      </div>`).join('') : emptyState('key', '尚无羁绊', '与人往复交心，方结羁绊。');
    } else {

        <div class="quest-card__head"><span class="ic" data-i="sparkle" style="--ic:16px;color:hsl(280 45% 58%)"></span><span class="quest-card__name">${name}</span><span class="pill">${(q && q.状态) || '潜伏中'}</span></div>
        <div class="quest-card__desc">来源 · ${(q && q.来源) || '—'}　潜在任务 · ${(q && q.潜在任务) || '—'}</div>
        <div class="row row--between"><span class="card__sub">优先级 ${num(q && q.优先级, 0)}</span><span class="card__sub">报酬 · ${(q && q.报酬) || '—'}</span></div>
      </div>`).join('') : emptyState('sparkle', '无埋设种子', '事件种子将在交互中埋下。');
    }
    container.innerHTML = seg + body;
    Icon.render(container);
    $$('.seg__item', container).forEach((b) => b.addEventListener('click', () => { UI.questTab = b.dataset.qt; renderQuest(container, Render.state); }));

  /* ---- 农牧 ---- */
  function farmDetail(key, plot, farm, magic) {
    const p = plot || {}, state = p.状态 || '荒地', crop = p.作物 || '';
    const days = num(p.剩余天数, 0), ripe = state === '种植中' && days <= 0;
    const pct = state === '种植中' && crop ? clamp(100 - days * 18, 5, 100) : 0;
    return `<div class="crop-plot" data-plot-detail="${key}">
      <div class="crop-plot__head">
        <span class="ic" data-i="${state === '荒地' ? 'stone' : crop ? 'wheat' : 'carrot'}" style="--ic:18px;color:${ripe ? 'var(--color-primary)' : 'var(--color-success)'}"></span>
        <span class="crop-plot__name">田格 (${key}) · ${state}${crop ? ' · ' + crop : ''}</span>
        <span class="ic status-icon ${p.今日已浇水 ? '已浇水' : '未浇水'}" data-i="${p.今日已浇水 ? 'water' : 'herb'}" title="${p.今日已浇水 ? '已浇水' : '未浇水'}"></span>
        ${p.已施肥 ? '<span class="ic status-icon 已施肥" data-i="fertilize" title="已施肥"></span>' : ''}
      </div>
      ${state === '种植中' && crop ? `<div class="row row--between"><span class="card__sub">${ripe ? '已成熟' : `约 ${days} 日后成熟`}</span><span class="card__sub">品质修正 ${num(p.品质修正, 0)}</span></div><div class="grow-bar"><div class="grow-bar__fill" style="width:${pct}%"></div></div>` : ''}
      ${magic ? `<div class="farm-magic-meta"><span>稳定度 ${clamp(num(p.魔力稳定度, 100), 0, 100)}</span><span>未养护 ${num(p.连续未养护天数, 0)} 日</span><span>变异 · ${p.变异状态 || '无'}</span></div>${p.环境标签 && p.环境标签.length ? `<div class="row">${pillsFrom(p.环境标签, 'pill--mint')}</div>` : ''}` : ''}
      <div class="card__sub">已收获 ${num(p.已收获次数, 0)} 次 · 过熟 ${num(p.过熟天数, 0)} 日</div>
      <div class="row farm-detail__actions">
        ${state === '种植中' && crop ? (ripe ? `<button class="btn btn--primary btn--sm" data-harvest="${key}"><span class="ic btn__icon" data-i="bag"></span>收获</button>` : `<button class="btn btn--sm" data-water="${key}"><span class="ic btn__icon" data-i="water"></span>浇水</button>`) : ''}
        ${state === '荒地' ? `<button class="btn btn--sm" data-till="${key}"><span class="ic btn__icon" data-i="hammer"></span>开垦</button>` : ''}
        ${state === '已开垦' ? `<button class="btn btn--sm" data-plant="${key}"><span class="ic btn__icon" data-i="grain"></span>播种</button>` : ''}
        ${magic && state === '种植中' ? `<button class="btn btn--sm" data-magic-water="${key}">魔力灌溉</button><button class="btn btn--sm" data-tend="${key}">养护</button>` : ''}
      </div>
    </div>`;
  }

  function bindFarmActions(container) {
    $$('[data-water]', container).forEach((b) => b.addEventListener('click', () => intend(`浇水：(${b.dataset.water})`)));
    $$('[data-harvest]', container).forEach((b) => b.addEventListener('click', () => intend(`收获：(${b.dataset.harvest})`)));
    $$('[data-till]', container).forEach((b) => b.addEventListener('click', () => intend(`开垦：(${b.dataset.till})`)));
    $$('[data-plant]', container).forEach((b) => b.addEventListener('click', () => intend(`播种：(${b.dataset.plant})`)));
    $$('[data-magic-water]', container).forEach((b) => b.addEventListener('click', () => intend(`魔力灌溉：(${b.dataset.magicWater})`)));
    $$('[data-tend]', container).forEach((b) => b.addEventListener('click', () => intend(`养护魔法农田：(${b.dataset.tend})`)));
    $$('[data-seed-use]', container).forEach((b) => b.addEventListener('click', () => intend(`准备用${b.dataset.seedUse}播种`)));
    $$('[data-care-livestock]', container).forEach((b) => b.addEventListener('click', () => intend(`照料畜牧设施：${b.dataset.careLivestock}`)));
  }

  function farmGrid(farm, magic) {
    const size = get(farm, magic ? '魔法农田大小' : '农田大小', {});
    const records = get(farm, magic ? '魔法农田网格' : '农田网格', {}) || {};
    const height = clamp(Math.floor(num(size.长, magic ? 2 : 3)), 1, 30);
    const width = clamp(Math.floor(num(size.宽, magic ? 2 : 3)), 1, 30);
    const inRange = new Set(), cells = [];
    for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
      const key = `${x},${y}`, p = records[key] || { x, y, 状态: '荒地' };
      inRange.add(key);
      const state = p.状态 || '荒地', crop = p.作物 || '', ripe = state === '种植中' && num(p.剩余天数, 0) <= 0;
      cells.push(`<button class="farm-cell ${magic ? 'is-magic' : ''} ${state === '种植中' ? 'is-planted' : state === '已开垦' ? 'is-tilled' : 'is-wild'} ${ripe ? 'is-ripe' : ''}" type="button" data-plot="${key}" aria-label="田格${key}，${state}${crop ? '，' + crop : ''}"><span class="farm-cell__coord">${x},${y}</span><span class="ic" data-i="${state === '荒地' ? 'stone' : crop ? 'wheat' : 'garden'}"></span><span class="farm-cell__name">${crop || state}</span></button>`);
    }
    const overflow = entries(records).filter(([key]) => !inRange.has(key));
    return { width, height, records, cells, overflow };
  }

  function renderFarm(container, s) {
    const farm = get(s, '农牧', {}), tab = UI.farmTab || 'normal';
    const tabs = `<div class="seg farm-tabs"><button class="seg__item ${tab === 'normal' ? 'is-active' : ''}" data-farm-tab="normal">普通农田</button><button class="seg__item ${tab === 'magic' ? 'is-active' : ''}" data-farm-tab="magic">魔法农田</button><button class="seg__item ${tab === 'seeds' ? 'is-active' : ''}" data-farm-tab="seeds">种子图鉴</button><button class="seg__item ${tab === 'care' ? 'is-active' : ''}" data-farm-tab="care">畜牧与堆肥</button></div>`;
    let html = tabs;
    if (tab === 'normal' || tab === 'magic') {
      const magic = tab === 'magic';
      if (magic && !get(farm, '魔法农田已解锁', false)) {
        html += emptyState('sparkle', '魔法农田尚未解锁', '通过剧情、设施或变量规则解锁后，魔法田格将在这里展开。');
        container.innerHTML = html; Icon.render(container);
      } else {
        const grid = farmGrid(farm, magic);
        html += panelH(magic ? '魔法农田' : '旅店农田', `${grid.width}×${grid.height}`);
        html += `<div class="notice notice--info"><span class="ic notice__icon" data-i="info"></span><div>点击田格查看状态与农事操作；坐标从 (0,0) 开始。</div></div>`;
        html += `<div class="farm-grid-scroll"><div class="farm-grid" style="grid-template-columns:repeat(${grid.width},minmax(64px,1fr));min-width:${grid.width * 70}px">${grid.cells.join('')}</div></div><div id="farmDetail"></div>`;
        if (grid.overflow.length) html += panelH('范围外田格', `${grid.overflow.length}`) + `<div class="farm-overflow">${grid.overflow.map(([key, p]) => farmDetail(key, p, farm, magic)).join('')}</div>`;
        container.innerHTML = html; Icon.render(container); bindFarmActions(container);
        $$('.farm-cell', container).forEach((cell) => cell.addEventListener('click', () => {
          $$('.farm-cell', container).forEach((x) => x.classList.toggle('is-active', x === cell));
          const detail = $('#farmDetail', container); detail.innerHTML = farmDetail(cell.dataset.plot, grid.records[cell.dataset.plot], farm, magic);
          Icon.render(detail); bindFarmActions(detail);
        }));
      }
    } else if (tab === 'seeds') {
      const seeds = entries(get(farm, '种子图鉴', {}));
      html += panelH('种子图鉴', seeds.length);
      html += seeds.length ? `<div class="seed-catalog">${seeds.map(([name, seed]) => `<article class="seed-card"><div class="building__head"><span class="ic building__icon" data-i="grain"></span><span class="building__name">${name}</span><span class="pill ${seed.类型 === '魔法' ? 'pill--mint' : ''}">${seed.类型 || '普通'}</span></div><div class="card__sub">季节 · ${(seed.可种季节 || []).join('、') || '未限定'}　生长 · ${num(seed.生长天数, 0)} 日　种子价 · ${num(seed.种子价, 0)}</div><div class="quest-card__desc">产出 · ${seed.产出 || '—'}　获取 · ${seed.获取方式 || '—'}</div><div class="card__sub">连续收获 · ${seed.可连续收获 ? `是 / 间隔 ${num(seed.收获间隔天数, 0)} 日 / 上限 ${num(seed.收获次数上限, 1)}${seed.永续 ? ' / 永续' : ''}` : '否'}</div>${seed.特殊条件 ? `<div class="card__sub">条件 · ${seed.特殊条件}</div>` : ''}${seed.产出效果 ? `<div class="card__sub">效果 · ${seed.产出效果}</div>` : ''}${seed.描述 ? `<p class="quest-card__desc">${seed.描述}</p>` : ''}<button class="btn btn--sm" data-seed-use="${name}">用于播种</button></article>`).join('')}</div>` : emptyState('grain', '种子图鉴为空', '获得种子资料后会在这里记录。');
      container.innerHTML = html; Icon.render(container); bindFarmActions(container);
    } else {
      const comp = get(farm, '堆肥箱', {}), live = entries(get(farm, '畜牧', {}));
      html += panelH('堆肥箱') + `<div class="card"><div class="row row--between"><span class="card__sub">状态 · ${(comp && comp.状态) || '空'}</span><span class="card__sub">倒计时 · <span class="num">${num(comp && comp.倒计时, 0)}</span></span></div></div>`;
      html += panelH('畜牧', `${live.length}`) + (live.length ? live.map(([name, l]) => { const hp = clamp(num(get(l, '健康度', 0), 0), 0, 100), col = hp >= 50 ? 'var(--color-success)' : 'var(--color-danger)'; return `<div class="livestock-card"><div class="building__head"><span class="ic building__icon" data-i="garden"></span><span class="building__name">${name}</span></div><div class="row row--between"><span class="card__sub">饲料 · ${num(get(l, '饲料倒计时', 0), 0)} 日</span><span class="card__sub">产出 · ${num(get(l, '产出倒计时', 0), 0)} 日</span></div><div class="stat-line"><span class="stat-line__label">健康 ${hp}</span><div class="stat-line__bar"><div class="stat-line__fill" style="width:${hp}%;background:${col}"></div></div></div><button class="btn btn--sm" data-care-livestock="${name}">照料</button></div>`; }).join('') : emptyState('garden', '无牲畜', '建造畜牧设施后将显示于此。'));
      container.innerHTML = html; Icon.render(container); bindFarmActions(container);
    }
    $$('[data-farm-tab]', container).forEach((button) => button.addEventListener('click', () => { UI.farmTab = button.dataset.farmTab; renderFarm(container, Render.state); }));
  }

  /* ============================================================
     对外接口
     ============================================================ */
  const PANELS = {
    overview: renderOverview,
    inventory: renderInventory,
    building: renderBuilding,
    map: renderMap,
    staff: renderStaff,
    visitor: renderVisitor,
    quest: renderQuest,
    farm: renderFarm,
  };
  const SLICE = {
    overview: (s) => JSON.stringify({ ec: get(s, '访客生态'), fc: get(s, '当日预报') }),
    inventory: (s) => JSON.stringify({ inv: get(s, '旅店.库存'), rec: get(s, '旅店.配方') }),
    building: (s) => JSON.stringify(get(s, '建筑')),
    map: (s) => JSON.stringify(get(s, '世界.地块')),
    staff: (s) => JSON.stringify(get(s, '旅店.员工')),
    visitor: (s) => JSON.stringify(get(s, '旅店.当前访客')),
    quest: (s) => JSON.stringify(get(s, '叙事引擎')),
    farm: (s) => JSON.stringify(get(s, '农牧')),
  };
  const UI = { invCat: '全部', invSearch: '', buildTab: 'built', questTab: 'commission', farmTab: 'normal' };
  const panelSig = {};

  const Render = {
    state: {},
    raw: '',

    hud(s) { try { renderHud(s); } catch (e) { console.error('hud', e); } },

    panel(name, s, force) {
      const fn = PANELS[name]; if (!fn) return;
      const container = document.querySelector(`.panel[data-panel="${name}"]`);
      if (!container) return;
      const sig = SLICE[name] ? SLICE[name](s) : '';
      if (!force && sig === panelSig[name]) return;
      panelSig[name] = sig;
      try { fn(container, s); } catch (e) { console.error('panel ' + name, e); }
    },

    choices(rawText) {
      const box = document.getElementById('choices');
      if (!box) return;
      const opts = Extract.extractOptions(rawText);
      if (!opts.length) { box.innerHTML = ''; return; }
      box.innerHTML = opts.map((o, i) => {
        const plain = String(o).replace(/<[^>]+>/g, '').trim();
        return `<button class="choice" data-choice="${i}" data-plain="${plain.replace(/"/g, '&quot;')}">
          <span class="choice__mark">${['◇', '◈', '✦', '❖', '✧'][i % 5]}</span>
          <span class="choice__text">${o}</span>
        </button>`;
      }).join('');
      $$('.choice', box).forEach((b) => b.addEventListener('click', () => {
        // 填入卡内 composer，玩家可改后再发送
        intend(b.dataset.plain);
        burst(window.innerWidth / 2, window.innerHeight * 0.7);
      }));
    }
  };

  window.Render = Render;
})();

/* ============================================================
   暮归旅店 · 双页书交互主控（伪同层宿主）
   翻页标签切换（inkBleed）/ 底栏动作 / 主题 / 全屏 / 设置
   Chat 以 400ms 高频轮询接管全局对话；stat_data 变化才重渲染面板

(function () {

  if (!Host.init()) return;

  /* ---------- 主题 ---------- */

    });
    form.appendChild(retry);
    form.addEventListener('submit', (e) => {

    apiPage.appendChild(form);

    apiPage.appendChild(h('div', { class: 'notice notice--info set-notice' }, [

    ]));

    const promptForm = h('form', { class: 'settings-form prompt-settings-form', id: 'promptSettingsForm' });
    const promptField = (label, name, value, help) => h('label', { class: 'set-field' }, [
      h('span', { class: 'set-field__label' }, label),
      h('span', { class: 'faint set-help' }, help),

    ]);

    ]);

    promptForm.addEventListener('submit', (e) => {

      toast('success', '提示词已保存', '空白栏目会继续使用程序内置默认提示词。');
    });
    promptForm.querySelector('[data-reset-prompts]').addEventListener('click', () => {
      promptForm.elements.normalPrompt.value = '';
      promptForm.elements.enddayPrompt.value = '';
      Settings.save({ prompts: { normal: '', endday: '' } });
      toast('info', '已恢复内置默认', '网页缓存中的自定义提示词已清空。');
    });
    promptPage.appendChild(promptForm);
    pop.appendChild(apiPage); pop.appendChild(promptPage);
    $$('.settings-tab', pop).forEach((tab) => tab.addEventListener('click', () => {
      const name = tab.dataset.settingsTab;
      $$('.settings-tab', pop).forEach((item) => { const on = item === tab; item.classList.toggle('is-active', on); item.setAttribute('aria-selected', on ? 'true' : 'false'); });
      $$('.settings-page', pop).forEach((page) => { const on = page.dataset.settingsPage === name; page.classList.toggle('is-active', on); page.hidden = !on; });
    }));

    backdrop.appendChild(pop); document.body.appendChild(backdrop);
    Icon.render(pop);
    backdrop.addEventListener('mousedown', (e) => { if (e.target === backdrop) close(); });
  }

  function h(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v === null || v === undefined) return;
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    });
    (Array.isArray(children) ? children : [children]).forEach((c) => {
      if (c == null || c === false) return;
      e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
    });
    return e;
  }

  /* ---------- 全屏（沉浸视口） ---------- */
  function syncFullscreenBtn() {
    const b = $('#fullscreenToggle');
    if (!b) return;
    const on = Host.immersive;
    Icon.set(b.querySelector('.ic'), on ? 'compress' : 'expand');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.setAttribute('aria-label', on ? '退出全屏' : '进入全屏');
    b.dataset.tip = on ? '退出全屏' : '进入全屏';
  }
  function toggleFullscreen() {
    Host.toggleImmersive();
    syncFullscreenBtn();
  }

  /* ---------- 底栏动作：填入 composer，由玩家确认发送 ---------- */
  function dockAction(act) {
    switch (act) {
      case 'cook': openTab('inventory'); toast('info', '灶事', '择一道食谱烹制。'); break;
      case 'water': Chat.compose('浇灌所有农田'); break;
      case 'rest': Chat.compose('小憩片刻，恢复精力'); break;
      case 'endday': confirmEndday(); break;
    }
  }

  /* ---------- 归寝确认 ---------- */
  function confirmEndday() {
    if (document.getElementById('enddayConfirm') || Chat.busy) return;
    const previous = document.activeElement;
    const ta = $('#composerInput');
    const existing = ta ? String(ta.value || '').trimEnd() : '';
    const action = '归寝入眠，结束今天';
    const finalText = existing ? existing + '\n' + action : action;
    const backdrop = h('div', { class: 'modal-backdrop', id: 'enddayConfirm' });
    const dialog = h('section', { class: 'daily-modal endday-confirm', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'enddayConfirmTitle' });
    const close = () => { backdrop.remove(); if (previous && previous.focus) previous.focus(); };
    dialog.appendChild(h('header', { class: 'daily-modal__head' }, [
      h('span', { class: 'ic', html: Icon.get('moon') }),
      h('h2', { id: 'enddayConfirmTitle' }, '归寝入眠')
    ]));
    dialog.appendChild(h('div', { class: 'daily-modal__body' }, [
      h('p', {}, '结束今天后将结算员工薪资、建筑维护费、植物成长与次日预报。'),
      h('div', { class: 'endday-preview' }, finalText)
    ]));
    const cancel = h('button', { class: 'btn btn--ghost', type: 'button', 'data-endday-cancel': '', onclick: close }, '取消');
    const confirm = h('button', { class: 'btn btn--primary', type: 'button', 'data-endday-confirm': '' }, '结束今天并发送');
    confirm.addEventListener('click', async () => {
      confirm.disabled = true; cancel.disabled = true; confirm.textContent = '正在发送归寝行动…';
      const ok = await Chat.handleUnifiedRequest(finalText, { kind: 'endday' });
      if (ok) close();
      else { confirm.disabled = false; cancel.disabled = false; confirm.textContent = '重新发送'; }
    });
    dialog.appendChild(h('div', { class: 'daily-modal__foot' }, [cancel, confirm]));
    backdrop.appendChild(dialog); document.body.appendChild(backdrop); Icon.render(dialog); confirm.focus();
    backdrop.addEventListener('mousedown', (e) => { if (e.target === backdrop) close(); });
    backdrop.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  }

  function formatLedgerNumber(value) {
    return new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 2 }).format(value);
  }

  /* ---------- 每日总结模态框 ---------- */
  function showDailySummary(detail) {
    const old = document.getElementById('dailySummary'); if (old) old.remove();
    const previous = document.activeElement;
    const backdrop = h('div', { class: 'modal-backdrop', id: 'dailySummary' });
    const dialog = h('section', { class: 'daily-modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'dailySummaryTitle' });
    const close = () => { backdrop.remove(); if (previous && previous.focus) previous.focus(); };
    dialog.appendChild(h('header', { class: 'daily-modal__head' }, [
      h('span', { class: 'ic', html: Icon.get('moon') }),
      h('h2', { id: 'dailySummaryTitle' }, '今日账簿'),
      h('button', { class: 'settings-pop__close', type: 'button', 'aria-label': '关闭每日总结', onclick: close }, h('span', { class: 'ic', html: Icon.get('close') }))
    ]));
    const value = (n) => Number.isFinite(Number(n)) ? formatLedgerNumber(Number(n)) : '暂无数据';
    const report = detail || {};
    const rows = report.beforeFunds == null ? [] : [
      ['原日初资金', value(report.initialFunds)],
      ['归寝前资金', value(report.beforeFunds)],
      ['员工薪资', '−' + value(report.salary)],
      ['建筑维护', '−' + value(report.maintenance)],
      ['日结后资金', value(report.afterFunds)]
    ];
    dialog.appendChild(h('div', { class: 'daily-modal__body' }, [
      rows.length ? h('dl', { class: 'daily-ledger' }, rows.flatMap(([label, amount]) => [h('dt', {}, label), h('dd', {}, amount)])) : null,
      h('div', { class: 'daily-summary-copy' }, String(report.summary || '').trim() || '日结完成，变量已更新。')
    ]));
    dialog.appendChild(h('div', { class: 'daily-modal__foot' }, [h('span', { class: 'faint' }, detail && detail.source === 'second' ? '由第二 API 结算' : '由当前主 API 结算'), h('button', { class: 'btn btn--primary', type: 'button', onclick: close }, '合上账簿')]));
    backdrop.appendChild(dialog); document.body.appendChild(backdrop); Icon.render(dialog);
    const focusables = () => Array.from(dialog.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'));
    const first = focusables()[0]; if (first) first.focus();
    backdrop.addEventListener('mousedown', (e) => { if (e.target === backdrop) close(); });
    backdrop.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { close(); return; }
      if (e.key !== 'Tab') return;
      const nodes = focusables(); if (!nodes.length) return;
      const a = nodes[0], z = nodes[nodes.length - 1];
      if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
      else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
    });
  }

  /* ---------- 状态轮询（面板/HUD；对话流由 Chat 自行轮询） ---------- */
  let lastSig = null, lastRaw = null, started = false;

  function refresh(force) {
    const state = MVU.getState();
    const sig = JSON.stringify(state);
    const raw = Chat.latestRaw();

    Render.state = state;
    Render.raw = raw;

    if (force || sig !== lastSig) {
      Render.hud(state);
      Render.panel(currentTab(), state, false);
    }
    if (force || raw !== lastRaw) {
      Render.choices(raw);
    }
    lastSig = sig;
    lastRaw = raw;
  }

  /* ---------- 初始化 ---------- */
  async function init() {
    Icon.render(document);

    // 等待 MVU 就绪
    await MVU.init();

    // 全局消息接管：400ms 高频轮询 + 气泡右键菜单 + composer
    Chat.init();

    // 首屏渲染
    Render.state = MVU.getState();
    Render.raw = Chat.latestRaw();
    Render.hud(Render.state);
    Render.panel(currentTab(), Render.state, true);
    Render.choices(Render.raw);
    lastRaw = Render.raw;
    lastSig = JSON.stringify(Render.state);

    // 对话流有变化时立刻重算选项，不等下一次状态轮询
    window.addEventListener('pastoral:chat', () => refresh(false));
    window.addEventListener('pastoral:daily-summary', (e) => showDailySummary(e.detail || {}));

    // 翻页标签
    $$('.tab').forEach((t) => t.addEventListener('click', () => openTab(t.dataset.tab)));

    // 主题 / 全屏 / 设置
    const themeBtn = $('#themeToggle'); if (themeBtn) themeBtn.addEventListener('click', toggleTheme);
    const fsBtn = $('#fullscreenToggle'); if (fsBtn) fsBtn.addEventListener('click', toggleFullscreen);
    syncFullscreenBtn();
    const setBtn = $('#settingsBtn'); if (setBtn) setBtn.addEventListener('click', openSettings);

    // 底栏
    $$('.dock__btn').forEach((b) => b.addEventListener('click', () => dockAction(b.dataset.act)));

    // Esc 关设置
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { const p = document.getElementById('settingsBackdrop'); if (p) p.remove(); }
    });

    // 外部退出全屏（Esc / 系统手势）时同步按钮
    window.addEventListener('pastoral:immersive', syncFullscreenBtn);

    // 1s 状态轮询（对话流由 Chat 以 400ms 独立轮询）
    if (!started) { started = true; setInterval(refresh, 1000); }

    // 欢迎语
    setTimeout(() => toast('magic', '暮归旅店 · 开张志', '愿这盏烛火，照亮你重建家业的路。'), 500);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
